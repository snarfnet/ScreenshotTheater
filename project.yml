name: ScreenshotTheater
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.screenshottheater
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  ScreenshotTheater:
    type: application
    platform: iOS
    sources: [ScreenshotTheater]
    settings:
      base:
        INFOPLIST_FILE: ScreenshotTheater/Info.plist
        PRODUCT_NAME: ScreenshotTheater
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: ScreenshotTheater/Info.plist
      properties:
        CFBundleName: "スクショ劇場"
        CFBundleDisplayName: "スクショ劇場"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: "作成した架空チャット画像を写真に保存します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIUserInterfaceStyle: Dark
        GADApplicationIdentifier: "ca-app-pub-9404799280370656~9796430707"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "cstr6suwn9.skadnetwork"
          - SKAdNetworkIdentifier: "4fzdc2evr5.skadnetwork"
          - SKAdNetworkIdentifier: "2fnua5tdw4.skadnetwork"
          - SKAdNetworkIdentifier: "ydx93a7ass.skadnetwork"
